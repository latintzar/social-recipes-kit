[project]
name = "llm"
version = "0.1.0"
description = "Leo LLM abstraction — chat, structured output, vision, embeddings, prompts, model registry, cost accounting."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.8",
    "jinja2>=3.1",
    "PyYAML>=6.0",
    "core",
]

[project.optional-dependencies]
bedrock = [
    "boto3>=1.34",
]
tokens = [
    "tiktoken>=0.5",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
