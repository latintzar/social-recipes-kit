[project]
name = "storage"
version = "0.1.0"
description = "Durable storage engines: Supabase CRUD substrate, mem0 semantic memory, pgvector embeddings. Scope-specific schemas (Lead, Proposal, Contractor, etc.) belong in apps/scope/product/backend/storage, not here."
requires-python = ">=3.11"
dependencies = [
    # Runtime deps. `core` provides http + supabase helpers + errors + retry.
    # `llm` provides embed (pgvector) and chat (summarize_recent).
    "core",
    "llm",
    "httpx>=0.27",
]

[project.optional-dependencies]
# mem0 SaaS client — optional; module degrades gracefully if absent (is_mem0_configured() → False).
# Pin <2 — v2 API is a different surface; audit + upgrade in a dedicated PR.
mem0 = ["mem0ai>=1.0.7,<2.0.0"]

dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
