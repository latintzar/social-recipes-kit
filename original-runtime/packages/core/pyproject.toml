[project]
name = "core"
version = "0.1.0"
description = "Leo runtime substrate — bootstrap, errors, Supabase, HTTP, auth, AWS, resilience. Zero Leo-package deps (leaf)."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.115",
    "python-dotenv>=1.0",
    "boto3>=1.34",
    "botocore>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "moto[s3]>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
