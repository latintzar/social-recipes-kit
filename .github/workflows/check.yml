name: Recipe webhook checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  webhook:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e 'packages/recipe-extractor[service]' pytest==9.2.0
      - run: python -m pytest -q packages/recipe-extractor/tests
      - run: python -m pip check
