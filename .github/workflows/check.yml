name: Recipe runtime checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    services:
      sessions:
        image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        env:
          POSTGRES_PASSWORD: disposable-test-password
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - run: python -m pip install uv==0.13.6
      - run: |
          uv venv --python python
          uv pip sync --python .venv/bin/python --require-hashes requirements-agent.lock
          uv pip install --python .venv/bin/python --no-deps -e .
      - name: Fetch exact external SDK source
        run: |
          git init "$RUNNER_TEMP/social-recipes-hermes"
          git -C "$RUNNER_TEMP/social-recipes-hermes" remote add origin https://github.com/NousResearch/hermes-agent.git
          git -C "$RUNNER_TEMP/social-recipes-hermes" fetch --depth 1 origin f0d94882e89ab8d4098b5bb2f166adfb9ee0a0ab
          git -C "$RUNNER_TEMP/social-recipes-hermes" checkout --detach FETCH_HEAD
      - name: Offline original turn and real SDK discovery
        run: SOCIAL_RECIPES_TEST_HERMES_SOURCE="$RUNNER_TEMP/social-recipes-hermes" .venv/bin/python -m pytest -q
      - name: Check dedicated session schema and roles
        env:
          PGPASSWORD: disposable-test-password
        run: psql -X -h localhost -p 5432 -U postgres -d postgres -f tests/runtime/check_session_schema.sql
      - run: .venv/bin/python scripts/check-runtime-lineage.py
