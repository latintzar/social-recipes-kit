[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "social-recipes-agent"
version = "0.2.0"
description = "The recovered Instagram recipe-agent runtime and reusable extraction kit"
requires-python = ">=3.14,<3.15"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "pydantic>=2.8",
  "PyYAML>=6.0", "fastmcp>=2.0", "yt-dlp>=2024.1.0",
  "boto3>=1.34", "botocore>=1.34", "python-dotenv>=1.0",
  "phonenumbers>=8.13", "jinja2>=3.1"
]

[project.optional-dependencies]
test = ["pytest>=8", "anyio>=4"]
commerce = ["stripe>=11.0"]

[project.scripts]
social-recipes-agent = "social_recipes_agent.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["runtime/social_recipes_agent"]

[tool.pytest.ini_options]
testpaths = ["tests/runtime", "packages/recipe-extractor/tests"]

# Include the retained implementation and recipe profile in source/wheel installs.
[tool.hatch.build.targets.wheel.force-include]
"original-runtime" = "social_recipes_agent/_source/original-runtime"
"packages/recipe-extractor/src" = "social_recipes_agent/_source/packages/recipe-extractor/src"
"runtime/profiles" = "social_recipes_agent/_source/runtime/profiles"
"runtime/sql" = "social_recipes_agent/_source/runtime/sql"
"runtime/hermes.lock.json" = "social_recipes_agent/_source/runtime/hermes.lock.json"
"LICENSES" = "social_recipes_agent/_source/LICENSES"
"THIRD-PARTY-NOTICES.md" = "social_recipes_agent/_source/THIRD-PARTY-NOTICES.md"
"provenance" = "social_recipes_agent/_source/provenance"

[tool.hatch.build]
exclude = ["**/__pycache__/**", "**/*.pyc", "**/.pytest_cache/**"]
